<div class="popup create-session">
    <h1>Nouveau chat</h1>
    <form>
        <div class="entry">
            <label for="name">Nom de la conversation</label>
            <input type="text" name="name" id="name" placeholder="New chat">
        </div>
        <div class="actions">
            <button class="second-button" type="reset">Annuler</button>
            <button class="main-button" type="submit">Ajouter</button>
        </div>
    </form>
</div>
